[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "audio_samples"
description = "Python bindings for the AudioSamples Rust ecosystem - fast, type-safe audio processing with automatic metadata coordination"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jack Geraghty (jmg049)", email = "jgeraghty049@gmail.com" },
]
maintainers = [
    { name = "Jack Geraghty (jmg049)", email = "jgeraghty049@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["audio", "signal-processing", "multimedia", "rust", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]
# The spectrogram classes (StftParams, MelParams, ...) are compiled into the
# extension and exposed as ``audio_samples.spectrograms``; the separate
# ``spectrograms`` pip package is not needed (its objects are not accepted by
# AudioSamples methods).
dependencies = [
    "numpy>=1.24.4",
]

[project.urls]
"Homepage" = "https://github.com/jmg049/audio_samples_python"
"Documentation" = "https://jmg049.github.io/audio_samples_python"
"Repository" = "https://github.com/jmg049/audio_samples_python"
"Bug Reports" = "https://github.com/jmg049/audio_samples_python/issues"

[project.optional-dependencies]
"mpl" = [
    "matplotlib>=3.7.5",
    "seaborn>=0.13.2",
]

# Enables the Rust-side plotly plotting backend (audio_samples/plotting feature).
# This compiles the upstream audio_samples crate with its 'plotting' feature,
# which brings in the Rust plotly, base64, and serde_json crates to generate
# self-contained HTML plots directly from Rust.
#
# Because this is a Cargo feature, it must be activated at build time:
#
#   pip install ".[plotting]" --config-settings="build-args=--features audio-samples-plotting"
#   # or equivalently:
#   MATURIN_PEP517_ARGS="--features audio-samples-plotting" pip install ".[plotting]"
#   # editable / development build:
#   maturin develop --features audio-samples-plotting
#
# There are no additional *Python* dependencies — all plotting work happens in Rust.
"plotting" = []

"docs" = [
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "myst-parser>=2.0.0",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.maturin]
python-source = "."
include = [
    "audio_samples/*.pyi",
    "audio_samples/utils/*.pyi",
    "audio_samples/mpl/*.pyi",
    "audio_samples/py.typed",
    "logo.png",
    { path = "CHANGELOG.md", format = "sdist" },
]
exclude = ["tests/*", "examples/*", "benches/*", "docs/*", "audio_samples/io_benching.ipynb"]

# Settings for checking the type stubs (tests/hooks/check_stubs.sh). The modules listed have no
# stubs of their own, so only their use of the stubs matters to these checks.
[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "audio_samples.bench_resampling",
    "audio_samples.benchmarks",
    "audio_samples.io_benchmark",
    "audio_samples.migrate",
    "audio_samples._migrate_table",
    "audio_samples._display",
    "audio_samples.examples.*",
    "audio_samples.mpl.comparison",
    "audio_samples.mpl.dashboard",
    "audio_samples.mpl.distributions",
    "audio_samples.mpl.envelopes",
    "audio_samples.mpl.events",
    "audio_samples.mpl.harmonic",
    "audio_samples.mpl.spectral",
    "audio_samples.mpl.timefreq",
    "audio_samples.mpl.vad",
    "audio_samples.mpl.waveform",
    "audio_samples.mpl._utils",
]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "docutils>=0.20.1",
    "dtmf-table>=1.0.3",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.7.5",
    "pandas>=2.0.3",
    "rich>=14.3.3",
    "scikit-learn>=1.3.2",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "py-spy>=0.4.1",
    "pyspy>=0.1.1",
    "resampy>=0.4.3",
    "samplerate>=0.2.3",
]
# Large downloads that only audio_samples/io_benchmark.py and interactive plotting use.
heavy = [
    "pyqt6>=6.7.1",
    "torchaudio>=2.5.1",
    "torchcodec>=0.9.1",
]
test = [
    "pytest>=7.4.0",
    "nbmake>=1.5",
    "ipykernel>=6.29.5",
    "matplotlib>=3.7.5",
    "pytest-timeout>=2.1.0",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.13.1",
    "mypy>=1.18",
    "pyright>=1.1.400",
]

[tool.pyright]
include = ["audio_samples/*.pyi", "audio_samples/utils", "audio_samples/mpl/*.pyi", "tests/typing/usage.py"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportOverlappingOverload = "none"
# Stub-only modules such as audio_samples.effects are attributes of the compiled extension.
reportMissingModuleSource = "none"
