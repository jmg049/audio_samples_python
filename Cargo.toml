[package]
name = "audio_samples_python"
version = "0.3.0"
edition = "2024"
description = "Python bindings for high-performance AudioSamples Rust ecosystem - fast, type-safe audio processing with automatic metadata coordination"
repository = "https://github.com/jmg049/audio_samples_python"
homepage = "https://github.com/jmg049/audio_samples_python"
documentation = "https://jmg049.github.io/audio_samples_python"
authors = ["Jack Geraghty (jmg049) <jgeraghty049@gmail.com>"]
readme = "README.md"
license = "MIT"
keywords = ["audio", "python", "bindings", "signal-processing", "multimedia"]
categories = ["multimedia::audio", "api-bindings"]
include = [
    "/src/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/audio_samples/*.pyi",
    "/audio_samples/utils/*.pyi",
    "/audio_samples/mpl/*.pyi",
    "/audio_samples/py.typed",
    "/logo.png",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "audio_samples"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17.1"
pyo3 = { version = "0.29", features = [
    "multiple-pymethods",
] }
audio_samples = { version = "3.0.0", features = [
    "python", "full_no_plotting", "educational"
] }
audio_samples_io = { version = "0.4.0", features = ["wav", "numpy", "flac"] }
numpy = "0.29"
serde_json = "1.0.149"
spectrograms = { version = "2.1.3", features = ["python"] }
non-empty-slice = "0.6"
num-complex = "0.4"
# Diagnostic code/help of core errors are forwarded to Python exceptions.
miette = { version = "7", default-features = false }

[build-dependencies]
# Sets the `Py_GIL_DISABLED` cfg when building for a free-threaded interpreter.
pyo3-build-config = "0.29"

# Build against sibling checkouts of audio_samples and audio_samples_io rather
# than their crates.io releases.
[patch.crates-io]
audio_samples = { path = "../audio_samples" }
audio_samples_io = { path = "../audio_samples_io" }

[features]
default = []
audio-samples-plotting = ["audio_samples/plotting"]
simd = ["audio_samples/simd"]
flac-parallel = ["audio_samples_io/flac-parallel"]
# Embeds pyo3's introspection data, from which `scripts/stubs.sh` generates the
# reference stubs. Only for that build: it adds about 1.4 MB to the extension, so
# release wheels are built without it.
stubs = ["pyo3/experimental-inspect"]

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "unwind"

# The build `scripts/stubs.sh` generates and checks the stubs from (with `--features stubs`).
# Unoptimised and unstripped: the stub generator reads symbols of the extension.
[profile.stubs]
inherits = "dev"
debug = false
