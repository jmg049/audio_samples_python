# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.2.4"

package:
  name: audio-samples
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/audio_samples/audio_samples-${{ version }}.tar.gz
  sha256: 3754742b8634514a49decf60e59f2b9bdb4956f35c371f856bd7dfe06d4d1493

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO: cargo-auditable-wrapper${{ ".bat" if win }}
      PYTHONIOENCODING: utf-8
    content:
      - if: win
        then:
          # Keeps paths short enough for the Windows path limit.
          - set CARGO_HOME=c:\.cg
          - md %CARGO_HOME%
          - copy "%RECIPE_DIR%\cargo-auditable-wrapper.bat" "%BUILD_PREFIX%\Library\bin\cargo-auditable-wrapper.bat"
        else:
          - cp "${RECIPE_DIR}/cargo-auditable-wrapper.sh" "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"
          - chmod 755 "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - cargo-auditable
  host:
    - maturin >=1.9,<2.0
    - pip
    - python
  run:
    - numpy >=1.24.4
    - python

tests:
  - python:
      imports:
        - audio_samples
      pip_check: true
  - script:
      - python -c "import numpy as np, audio_samples as a; s = a.AudioSamples.new_mono(np.zeros(16, dtype=np.float32), 44100); assert s.sample_rate == 44100"

about:
  summary: Python bindings for the AudioSamples Rust ecosystem
  description: |
    Fast, type-safe audio processing built on the audio_samples and
    audio_samples_io Rust crates. Audio is a typed object carrying its sample
    rate and channel layout rather than an unstructured numeric buffer.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/jmg049/audio_samples_python
  repository: https://github.com/jmg049/audio_samples_python
  documentation: https://jmg049.github.io/audio_samples_python

extra:
  recipe-maintainers:
    - jmg049
