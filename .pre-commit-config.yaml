# Pre-commit hooks (https://pre-commit.com).
#
#   pre-commit install            # once per clone
#   pre-commit run --all-files    # run everything manually
#
# The notebook hooks guard the tutorials in docs/source/tutorials: they must be
# committed without outputs, and they must execute (each asserts the numbers
# its text states). Executing them needs the extension built into the active
# environment (`maturin develop --release`). The type-stub hook builds its own.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (every warning is an error)
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|build\.rs|Cargo\.(toml|lock)|clippy\.toml)$

      - id: notebooks-clean
        name: tutorial notebooks have no outputs
        entry: tests/hooks/check_notebooks_clean.py
        language: system
        files: ^docs/source/tutorials/.*\.ipynb$

      - id: notebooks-execute
        name: tutorial notebooks execute and pass their checks
        entry: tests/hooks/check_notebooks.sh
        language: system
        files: ^docs/source/tutorials/.*\.ipynb$

      # Builds the extension with pyo3's introspection data (scripts/stubs.sh --check):
      # stubs/generated/ must be what the bindings generate, and the hand-written stubs must
      # agree with it, keep every overload's result, and pass stubtest, mypy and pyright.
      - id: type-stubs
        name: type stubs match the Rust bindings (scripts/stubs.sh --check)
        entry: tests/hooks/check_stubs.sh
        language: system
        pass_filenames: false
        files: ^(audio_samples/.*\.pyi?|stubs/.*|scripts/stubs\.sh|tests/typing/.*|tests/test_stub_types\.py|tests/test_librosa_stubs\.py|tests/hooks/check_stubs\.sh|pyproject\.toml|build\.rs|Cargo\.(toml|lock)|src/.*\.rs)$
