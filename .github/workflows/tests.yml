# Builds the extension and runs the Python tests on every push to main and every
# pull request.
#
# audio_samples is checked out next to this repository for its golden fixtures,
# which the tests read from ../audio_samples. The tests run from outside the
# checkout so they import the installed package.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: audio_samples_python
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jmg049/audio_samples
          ref: v3.0.0
          path: audio_samples
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: audio_samples_python
      - name: Build the extension and run the tests
        working-directory: audio_samples_python
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install "maturin>=1.9,<2.0" "numpy>=1.24.4" pytest pytest-timeout scipy librosa soundfile matplotlib
          maturin build --release --out "$RUNNER_TEMP/dist"
          pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          repo="$PWD"
          (cd "$RUNNER_TEMP" && pytest "$repo/tests" -q --rootdir="$repo")
