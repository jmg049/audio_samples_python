name: Type stubs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: audio_samples_python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: audio_samples_python
      - name: Install the checkers
        working-directory: audio_samples_python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip maturin
          .venv/bin/python -m pip install --group test --group typing
      # Builds with pyo3's introspection data, regenerates the stubs and fails if
      # stubs/generated/ or the hand-written stubs disagree with the bindings.
      - name: Check the stubs
        working-directory: audio_samples_python
        run: tests/hooks/check_stubs.sh
