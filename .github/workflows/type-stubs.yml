name: Type stubs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: audio_samples_python
      # The bindings build against sibling checkouts of the crates.
      - uses: actions/checkout@v7
        with:
          repository: jmg049/audio_samples
          path: audio_samples
      - uses: actions/checkout@v7
        with:
          repository: jmg049/audio_samples_io
          path: audio_samples_io
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: audio_samples_python
      - name: Build the extension
        working-directory: audio_samples_python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin
          .venv/bin/maturin develop --group test
      - name: Check the stubs
        working-directory: audio_samples_python
        run: tests/hooks/check_stubs.sh
