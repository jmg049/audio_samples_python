name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: audio_samples_python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: audio_samples_python
      - name: rustfmt
        working-directory: audio_samples_python
        run: cargo fmt --check
      # Lint levels are set at the top of src/lib.rs; every warning fails the job.
      - name: clippy
        working-directory: audio_samples_python
        run: cargo clippy --all-targets -- -D warnings
